name: Revalidate SEO pages

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel production deployment
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "::error::Configure the VERCEL_DEPLOY_HOOK_URL Actions secret."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 \
            --output /dev/null \
            --write-out "Triggered Vercel deployment (HTTP %{http_code}).\n" \
            --request POST "$VERCEL_DEPLOY_HOOK_URL"
