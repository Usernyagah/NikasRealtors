# Force HTTPS and redirect www to non-www
[[redirects]]
  from = "https://www.nikasrealtors.com/*"
  to = "https://nikasrealtors.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://nikasrealtor.com/*"
  to = "https://nikasrealtors.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://nikasrealtors.com/*"
  to = "https://nikasrealtors.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.nikasrealtors.com/*"
  to = "https://nikasrealtors.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/about-us"
  to = "/about"
  status = 301

[[redirects]]
  from = "/contact-us"
  to = "/contact"
  status = 301

[[redirects]]
  from = "/listings"
  to = "/sales"
  status = 301

[[redirects]]
  from = "/for-sale"
  to = "/sales"
  status = 301

[[redirects]]
  from = "/properties"
  to = "/sales"
  status = 301
  force = true

[[redirects]]
  from = "/for-rent"
  to = "/rentals"
  status = 301

[[redirects]]
  from = "/home"
  to = "/"
  status = 301

# Serve generated SEO pages before the SPA fallback.
[[redirects]]
  from = "/projects/:slug"
  to = "/projects/:slug/index.html"
  status = 200

[[redirects]]
  from = "/sales/:id"
  to = "/sales/:id/index.html"
  status = 200

[[redirects]]
  from = "/rentals/:id"
  to = "/rentals/:id/index.html"
  status = 200

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
